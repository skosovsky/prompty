id: support_agent
version: "1.2"
description: "Customer support agent"

model_options:
  temperature: 0.7
  max_tokens: 2048

inputs:
  user_query:
    type: string
    required: true
  bot_name:
    type: string
    default: "SupportBot"

tools:
  - name: get_order_status
    description: "Get order status"
    parameters:
      type: object
      properties:
        order_id:
          type: string

messages:
  - role: system
    content: "You are {{ .Input.bot_name }}. {{ render_tools_as_xml .Tools }}"
  - role: user
    content: "{{ .Input.user_query }}"
    optional: true
