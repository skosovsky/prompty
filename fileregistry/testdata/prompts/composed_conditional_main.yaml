id: composed_conditional_main
inputs:
  query:
    type: string
    required: true
imports:
  - id: composed_child
    condition:
      match:
        capabilities.workspace_enabled: true
layers:
  - id: base_system
    role: system
    content: "Base assistant."
  - id: child_layer
    import_ref: composed_child
  - id: user_turn
    role: user
    content: "{{ .Input.query }}"
