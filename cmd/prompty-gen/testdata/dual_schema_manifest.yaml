id: fixtures/dual_schema
version: "1"

inputs:
  prompt:
    type: string
    required: true

response_format:
  name: dual_schema_output
  schema:
    type: object
    properties:
      id:
        type: string
      note:
        type: string
      name:
        type: string
      count:
        type: integer
      tags:
        anyOf:
          - type: array
            items:
              type: string
          - type: "null"
      score:
        anyOf:
          - type: number
          - type: "null"
      details:
        type: object
        properties:
          active:
            type: boolean
        required:
          - active
        additionalProperties: false
    required:
      - id
      - name
      - tags
      - score
      - details
    additionalProperties: false

messages:
  - role: user
    content: "{{ .Input.prompt }}"
