name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: set-matrix
        run: |
          MODULES=$(python3 scripts/workspace.py --json)
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  lint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test
    needs: [prepare-matrix, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -v -race ./...

  generated-consumer:
    name: Deterministic generated consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make gen-check
      - run: make release-check

  host-dispatch:
    name: Host dispatch (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [local, published]
    steps:
      - uses: actions/checkout@v6
        with:
          path: prompty
      - uses: actions/setup-go@v6
        with:
          go-version-file: prompty/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: prompty
          args: --timeout=5m
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/toolsy
          ref: 6ed0a8a6a4e664c25f32397fa63dd6f0a46cba09
          path: toolsy
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/contexty
          ref: 3ce901169b09b7136b126d9baa98e1875b33fa82
          path: contexty
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/routery
          ref: fe61308e030e163195ccdb4d548109a5a4ebdde1
          path: routery
      - name: Check local sources
        if: matrix.mode == 'local'
        working-directory: prompty
        run: >-
          python3 scripts/host_dispatch_checks.py local
          --source toolsy=../toolsy --source contexty=../contexty --source routery=../routery
          --run --report host-dispatch-local.json
      - name: Check published dependencies
        if: matrix.mode == 'published'
        working-directory: prompty
        run: python3 scripts/host_dispatch_checks.py published --run --report host-dispatch-published.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-dispatch-${{ matrix.mode }}
          path: prompty/host-dispatch-*.json
